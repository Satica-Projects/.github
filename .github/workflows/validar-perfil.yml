name: CI do perfil

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar-readme:
    name: Validar README do perfil
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Conferir o conteúdo do README
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('profile/README.md')
          lines = readme.read_text(encoding='utf-8').splitlines()
          required_headings = ('# Satica Projects', '## Para quem está no grupo')
          for heading in required_headings:
              if heading not in lines:
                  raise SystemExit(f'{readme}: cabeçalho obrigatório ausente: {heading}')
          PY
